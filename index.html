<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WBPSC Miscellaneous - Merged Mock (Q1–Q50)</title>
<style>
  :root {
    --primary: #1e3a8a;
    --primary-hover: #172554;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --border: #e2e8f0;
    --correct-bg: #dcfce7;
    --correct-border: #22c55e;
    --wrong-bg: #fee2e2;
    --wrong-border: #ef4444;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
  .container { max-width: 900px; margin: 0 auto; background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 14px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .timer { font-size: 1.1rem; font-weight: 700; color: #b91c1c; background: #fee2e2; padding: 6px 14px; border-radius: 6px; }
  
  /* Palette */
  .palette-box { margin-bottom: 20px; padding: 12px; background: #f1f5f9; border-radius: 8px; }
  .palette-title { font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 6px; }
  .p-btn { width: 32px; height: 32px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.15s; }
  .p-btn:hover { background: #e2e8f0; }
  .p-btn.answered { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
  .p-btn.correct { background: #22c55e; color: #fff; border-color: #16a34a; }
  .p-btn.wrong { background: #ef4444; color: #fff; border-color: #dc2626; }
  
  .q-card { margin-bottom: 24px; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: #fafafa; }
  .q-meta { font-size: 0.75rem; font-weight: 700; color: #2563eb; text-transform: uppercase; margin-bottom: 4px; }
  .q-title { font-weight: 600; font-size: 1rem; margin-bottom: 12px; line-height: 1.45; }
  .opt { display: block; margin: 6px 0; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; transition: 0.15s; background: #ffffff; }
  .opt:hover { background: #f8fafc; }
  .opt input { margin-right: 10px; }
  .correct-highlight { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; font-weight: 600; color: #14532d; }
  .wrong-highlight { background: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; font-weight: 600; color: #7f1d1d; }
  .exp { display: none; margin-top: 12px; padding: 12px 14px; background: #f0fdf4; border-left: 4px solid #16a34a; font-size: 0.9rem; color: #166534; border-radius: 0 6px 6px 0; }
  
  .btn-submit { display: block; width: 100%; padding: 14px; background: var(--primary); color: #fff; font-size: 1.1rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: 0.2s; }
  .btn-submit:hover { background: var(--primary-hover); }
  .result-box { display: none; margin-bottom: 24px; padding: 20px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; text-align: center; }
  .score-val { font-size: 2.2rem; font-weight: 800; color: #1e40af; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2 style="margin:0; font-size: 1.3rem;">WBPSC Miscellaneous Mock (Phase 1 & 2)</h2>
      <small style="color:#64748b;">Questions 1–50 • 100 Marks • Marking: +2 / -0.67</small>
    </div>
    <div class="timer" id="timer">Time Left: 50:00</div>
  </div>

  <div id="result" class="result-box">
    <div>Your Final Score</div>
    <div class="score-val" id="score-text">0 / 100</div>
    <div id="score-details" style="font-size:0.95rem; color:#475569; margin-top:8px;"></div>
  </div>

  <div class="palette-box">
    <div class="palette-title">Question Palette (Click number to jump)</div>
    <div class="palette-grid" id="palette-grid"></div>
  </div>

  <form id="quiz-form"></form>

  <button type="button" class="btn-submit" id="submit-btn" onclick="evaluateQuiz()">Submit Test & View Solutions</button>
</div>

<script>
const questions = [
  // --- PHASE 1 (1 to 25) ---
  { s: "History", q: "Who among the following was the founder-editor of the revolutionary journal 'Sandhya'?", o: ["Bhupendranath Datta", "Brahmabandhab Upadhyay", "Barindra Kumar Ghosh", "Aurobindo Ghosh"], a: 1, e: "Brahmabandhab Upadhyay founded the nationalist Bengali journal 'Sandhya' in 1904 during the anti-partition agitation." },
  { s: "History", q: "Which among the following dynasties built the famous Sun Temple at Konark?", o: ["Eastern Ganga Dynasty", "Somavamsi Dynasty", "Gajapati Dynasty", "Sena Dynasty"], a: 0, e: "King Narasimhadeva I of the Eastern Ganga Dynasty built the Konark Sun Temple in the 13th century." },
  { s: "History", q: "In which year was the partition of Bengal annulled by Lord Hardinge II?", o: ["1909", "1911", "1912", "1916"], a: 1, e: "The Partition of Bengal was annulled at the Delhi Durbar in December 1911, and the capital was shifted to Delhi." },
  { s: "History", q: "The 'Tattwabodhini Sabha' was established in 1839 by:", o: ["Raja Ram Mohan Roy", "Debendranath Tagore", "Keshab Chandra Sen", "Ishwar Chandra Vidyasagar"], a: 1, e: "Debendranath Tagore founded Tattwabodhini Sabha on 6 October 1839 to propagate the philosophical essence of the Upanishads." },
  { s: "Geography (WB)", q: "The 'Chilapatapalli' or Chilapata Forest in West Bengal is located in which district?", o: ["Jalpaiguri", "Alipurduar", "Cooch Behar", "Darjeeling"], a: 1, e: "Chilapata Forest is situated in the Alipurduar district, serving as an elephant corridor between Jaldapara and Buxa." },
  { s: "Geography (WB)", q: "Which river serves as the international border between West Bengal (India) and Bangladesh near the Sundarbans?", o: ["Ichamati", "Kalindi", "Raimangal", "Matla"], a: 2, e: "The Raimangal and Hariabhanga rivers demarcate the international border between India and Bangladesh in the deltaic Sundarbans." },
  { s: "Geography (WB)", q: "In West Bengal, laterite soil is predominantly found in which of the following regions?", o: ["Terai", "Rarh region", "Sundarbans", "Coastal plains"], a: 1, e: "The Rarh plain (parts of Purulia, Bankura, Birbhum, and Paschim Medinipur) is dominated by infertile red lateritic soils." },
  { s: "Geography (WB)", q: "Which national park in West Bengal is globally famous as a habitat for the endangered One-horned Rhinoceros?", o: ["Buxa", "Jaldapara", "Neora Valley", "Singalila"], a: 1, e: "Jaldapara National Park holds the largest population of the Great Indian One-horned Rhinoceros in West Bengal." },
  { s: "Polity", q: "Which Article of the Indian Constitution empowers the Governor to promulgate Ordinances during the recess of the legislature?", o: ["Article 123", "Article 213", "Article 217", "Article 161"], a: 1, e: "Article 213 grants ordinance-making power to the Governor, while Article 123 grants it to the President." },
  { s: "Polity", q: "Under which Constitutional Amendment Act was the voting age reduced from 21 years to 18 years?", o: ["42nd Amendment", "44th Amendment", "61st Amendment", "73rd Amendment"], a: 2, e: "The 61st Constitutional Amendment Act (1988, implemented in 1989) amended Article 326 to lower the voting age to 18." },
  { s: "Polity", q: "The concept of 'Directive Principles of State Policy' in the Indian Constitution was borrowed from:", o: ["United Kingdom", "Ireland", "USA", "Australia"], a: 1, e: "Part IV (Directive Principles of State Policy) was adopted from the Constitution of Ireland (1937)." },
  { s: "Science", q: "Which compound is responsible for the characteristic pungent odor of garlic?", o: ["Chlorine compound", "Sulphur compound (Allicin)", "Fluorine compound", "Nitrogen compound"], a: 1, e: "Allicin, an organosulfur compound produced when garlic tissues are damaged, causes its pungent aroma." },
  { s: "Science", q: "In optical fibers, light propagates through the core primarily by which phenomenon?", o: ["Dispersion", "Total Internal Reflection", "Diffraction", "Refraction"], a: 1, e: "Optical fibers transmit light across long distances via repeated Total Internal Reflection (TIR) at the core-cladding interface." },
  { s: "Science", q: "Which enzyme present in human saliva initiates the digestion of dietary starch?", o: ["Pepsin", "Ptyalin (Salivary Amylase)", "Trypsin", "Lipase"], a: 1, e: "Salivary amylase (ptyalin) breaks cooked starch down into maltose and short oligosaccharides in the mouth." },
  { s: "Science", q: "Heavy water (D₂O) is used in nuclear reactors primarily as a:", o: ["Fuel", "Coolant only", "Moderator", "Shielding material"], a: 2, e: "Heavy water acts as a moderator to slow down fast neutrons so that fission reactions can be maintained effectively." },
  { s: "Science", q: "The chemical name of 'Baking Soda' is:", o: ["Sodium Carbonate", "Sodium Bicarbonate", "Calcium Carbonate", "Sodium Hydroxide"], a: 1, e: "Baking soda is Sodium Bicarbonate (NaHCO₃). Sodium Carbonate (Na₂CO₃) is washing soda." },
  { s: "Static GK / Lit", q: "Who is the author of the Bengali literary work 'Aranyak'?", o: ["Tarasankar Bandyopadhyay", "Bibhutibhushan Bandyopadhyay", "Manik Bandyopadhyay", "Sarat Chandra Chattopadhyay"], a: 1, e: "Bibhutibhushan Bandyopadhyay authored the classic nature-novel 'Aranyak' based on his stay in Bihar's forests." },
  { s: "Static GK", q: "The 'Dadasaheb Phalke Award' is India's highest civilian award in the field of:", o: ["Classical Dance", "Cinema", "Literature", "Journalism"], a: 1, e: "The Dadasaheb Phalke Award is presented annually at the National Film Awards for lifetime contribution to Indian cinema." },
  { s: "Geography (India)", q: "Which international boundary line separates India and China along the north-eastern border?", o: ["Radcliffe Line", "Durand Line", "McMahon Line", "Palk Strait"], a: 2, e: "The McMahon Line demarcates the boundary between China (Tibet) and India in the eastern sector." },
  { s: "Static GK", q: "The headquarters of the International Court of Justice (ICJ) is situated in:", o: ["Geneva", "The Hague", "Vienna", "New York"], a: 1, e: "The ICJ sits at the Peace Palace in The Hague, Netherlands (the only principal UN organ outside New York)." },
  { s: "Arithmetic", q: "A sum of money amounts to ₹7,200 in 2 years and ₹10,200 in 5 years at simple interest. What is the rate of interest per annum?", o: ["10%", "12.5%", "15%", "19.23%"], a: 3, e: "Interest for 3 years = 10200 - 7200 = ₹3,000. Interest for 1 year = ₹1,000. Principal = 7200 - (2 × 1000) = ₹5,200. Rate = (1000 / 5200) × 100 = 19.23%." },
  { s: "Arithmetic", q: "If A:B = 2:3, B:C = 4:5, and C:D = 6:7, what is the ratio of A:D?", o: ["16:35", "8:15", "12:35", "16:21"], a: 0, e: "A/D = (A/B) × (B/C) × (C/D) = (2/3) × (4/5) × (6/7) = 48/105 = 16/35." },
  { s: "Arithmetic", q: "A can finish a piece of work in 12 days and B can do it in 18 days. If they work together for 4 days, what fraction of the work is left unfinished?", o: ["4/9", "5/9", "2/3", "7/18"], a: 0, e: "Combined rate = 1/12 + 1/18 = 5/36 per day. In 4 days, work done = 4 × (5/36) = 5/9. Work left = 1 - 5/9 = 4/9." },
  { s: "Arithmetic", q: "By selling an article for ₹960, a shopkeeper makes a loss of 20%. At what price should he sell it to gain 15%?", o: ["₹1,280", "₹1,320", "₹1,380", "₹1,440"], a: 2, e: "CP = 960 / 0.80 = ₹1,200. Desired SP = 1200 × 1.15 = ₹1,380." },
  { s: "Arithmetic", q: "A train 180 meters long passes an electric pole in 9 seconds. How long will it take to cross a platform of length 320 meters at the same speed?", o: ["20 seconds", "25 seconds", "22.5 seconds", "28 seconds"], a: 1, e: "Speed = 180 / 9 = 20 m/s. Total distance to cross platform = 180 + 320 = 500 m. Time = 500 / 20 = 25 seconds." },

  // --- PHASE 2 (26 to 50) ---
  { s: "History", q: "Who established the 'Anushilan Samiti' in Calcutta in 1902?", o: ["Pramathanath Mitra", "Rash Behari Bose", "Sachindra Nath Sanyal", "Jatindranath Mukherjee"], a: 0, e: "Pramathanath Mitra (P. Mitra), along with Jatindranath Banerjee and Barindra Ghosh, founded the Anushilan Samiti in 1902." },
  { s: "History", q: "The famous 'Chauri Chaura' incident took place in which present-day district of Uttar Pradesh?", o: ["Gorakhpur", "Varanasi", "Deoria", "Ballia"], a: 0, e: "The Chauri Chaura incident occurred on 4 February 1922 in the Gorakhpur district, prompting Gandhi to call off the Non-Cooperation Movement." },
  { s: "History", q: "Who among the following wrote the patriotic song 'Dhana Dhanya Pushpa Bhara'?", o: ["Rabindranath Tagore", "Dwijendralal Ray", "Atulprasad Sen", "Rajanikanta Sen"], a: 1, e: "Dwijendralal Ray (D.L. Ray) composed this celebrated patriotic song in his historical play 'Shahjahan' (1909)." },
  { s: "History", q: "Who was the Viceroy of India when the Indian National Congress was founded in 1885?", o: ["Lord Ripon", "Lord Dufferin", "Lord Lansdowne", "Lord Curzon"], a: 1, e: "Lord Dufferin served as the Viceroy of India from 1884 to 1888 when the INC was founded in Bombay." },
  { s: "Geography (WB)", q: "Which district of West Bengal has the highest population density as per the 2011 Census?", o: ["Howrah", "North 24 Parganas", "Kolkata", "Hooghly"], a: 2, e: "Kolkata has the highest population density in West Bengal (~24,306 people per sq km), followed by Howrah." },
  { s: "Geography (WB)", q: "The 'Mahananda Wildlife Sanctuary' is situated in which district of West Bengal?", o: ["Jalpaiguri", "Darjeeling", "Kalimpong", "Alipurduar"], a: 1, e: "Mahananda Wildlife Sanctuary is located in the Darjeeling district, situated between the Teesta and Mahananda rivers." },
  { s: "Geography (WB)", q: "Which river is known as the 'Lifeline of Sikkim' and flows through West Bengal before entering Bangladesh?", o: ["Teesta", "Torsa", "Jaldhaka", "Raidak"], a: 0, e: "The Teesta River originates at Cholamu Lake in Sikkim and flows across North Bengal before merging into the Brahmaputra (Jamuna) in Bangladesh." },
  { s: "Geography (India)", q: "The Pulicat Lake, the second largest brackish water lake in India, straddles the border between which two states?", o: ["Odisha and Andhra Pradesh", "Andhra Pradesh and Tamil Nadu", "Tamil Nadu and Kerala", "Karnataka and Goa"], a: 1, e: "Pulicat Lagoon lies on the border of Andhra Pradesh (Nellore) and Tamil Nadu (Tiruvallur), protected by the barrier island Sriharikota." },
  { s: "Polity", q: "Which Article of the Constitution deals with the appointment and duties of the Attorney General for India?", o: ["Article 72", "Article 76", "Article 148", "Article 165"], a: 1, e: "Article 76 provides for the Attorney General for India (the highest law officer in the country), appointed by the President." },
  { s: "Polity", q: "The concept of 'Concurrent List' in the Indian Constitution was adopted from which country?", o: ["Australia", "Canada", "USA", "Soviet Union"], a: 0, e: "The Seventh Schedule's Concurrent List and the provision for joint sittings were borrowed from Australia." },
  { s: "Polity", q: "A Money Bill passed by the Lok Sabha must be returned by the Rajya Sabha within how many days?", o: ["7 days", "14 days", "21 days", "30 days"], a: 1, e: "Article 109 specifies that the Rajya Sabha has 14 days to make recommendations on a Money Bill, failing which it is deemed passed." },
  { s: "Science", q: "Which gas is predominantly responsible for the greenhouse effect on Earth?", o: ["Methane", "Water Vapour", "Carbon Dioxide", "Ozone"], a: 1, e: "While CO₂ is the main driver of anthropogenic global warming, natural atmospheric Water Vapour accounts for roughly 60% of the natural greenhouse effect." },
  { s: "Science", q: "The disease 'Scurvy' is caused due to the deficiency of which vitamin?", o: ["Vitamin A", "Vitamin B1", "Vitamin C", "Vitamin K"], a: 2, e: "Scurvy is caused by Vitamin C (ascorbic acid) deficiency, resulting in bleeding gums, weakness, and skin lesions." },
  { s: "Science", q: "Which physical quantity has the unit 'Weber' (Wb)?", o: ["Magnetic Flux", "Magnetic Flux Density", "Self Inductance", "Electric Field"], a: 0, e: "Weber (Wb) is the SI unit of Magnetic Flux. Magnetic flux density is measured in Tesla (Weber/m²)." },
  { s: "Science", q: "Which endocrine gland produces the hormone 'Calcitonin' to regulate calcium levels?", o: ["Parathyroid gland", "Thyroid gland", "Adrenal cortex", "Pituitary gland"], a: 1, e: "Calcitonin is secreted by the parafollicular cells (C-cells) of the thyroid gland to lower blood calcium levels." },
  { s: "Science", q: "What is the pH of human blood under normal physiological conditions?", o: ["6.8 – 7.0", "7.35 – 7.45", "7.8 – 8.0", "8.2 – 8.5"], a: 1, e: "Normal arterial blood pH is tightly regulated within the slightly alkaline range of 7.35 to 7.45." },
  { s: "Static GK / Lit", q: "The classic Bengali fictional sleuth 'Byomkesh Bakshi' was created by:", o: ["Sharadindu Bandyopadhyay", "Satyajit Ray", "Nihar Ranjan Gupta", "Hemendra Kumar Roy"], a: 0, e: "Sharadindu Bandyopadhyay introduced 'Satyanweshi' Byomkesh Bakshi in 1932 with the story 'Satyanweshi'." },
  { s: "Static GK", q: "Where are the headquarters of the Food and Agriculture Organization (FAO) located?", o: ["Rome, Italy", "Geneva, Switzerland", "Paris, France", "Nairobi, Kenya"], a: 0, e: "The FAO was founded in 1945 and is headquartered in Rome, Italy." },
  { s: "Static GK", q: "Which folk dance form belongs to the state of Gujarat and is performed during Navratri?", o: ["Ghoomar", "Garba", "Lavani", "Bhangra"], a: 1, e: "Garba and Dandiya Raas are traditional folk dances native to Gujarat, performed throughout Navratri." },
  { s: "Static GK", q: "Who was the first Indian to win the Nobel Prize in Physics?", o: ["Sir C.V. Raman", "Subrahmanyan Chandrasekhar", "Hargobind Khorana", "Homi J. Bhabha"], a: 0, e: "Sir C.V. Raman was awarded the Nobel Prize in Physics in 1930 for his discovery of the Raman Effect." },
  { s: "Arithmetic", q: "The average age of 30 students in a class is 14 years. If the teacher's age is included, the average increases by 1 year. What is the teacher's age?", o: ["42 years", "44 years", "45 years", "48 years"], a: 2, e: "Total age of 30 students = 30 × 14 = 420. Total age with teacher (31 persons) = 31 × 15 = 465. Teacher's age = 465 - 420 = 45 years." },
  { s: "Arithmetic", q: "What is the compound interest on ₹12,000 for 2 years at 10% per annum, compounded annually?", o: ["₹2,400", "₹2,520", "₹2,640", "₹2,420"], a: 1, e: "Amount = 12000 × (1.10)² = 12000 × 1.21 = ₹14,520. CI = 14520 - 12000 = ₹2,520." },
  { s: "Arithmetic", q: "The HCF of two numbers is 16 and their LCM is 192. If one of the numbers is 48, find the other number.", o: ["56", "64", "72", "80"], a: 1, e: "Product of two numbers = HCF × LCM. 48 × Other = 16 × 192. Other = (16 × 192) / 48 = 192 / 3 = 64." },
  { s: "Arithmetic", q: "Two pipes A and B can fill a cistern in 20 minutes and 30 minutes respectively. If both pipes are opened together, how long will it take to fill the cistern?", o: ["10 minutes", "12 minutes", "15 minutes", "18 minutes"], a: 1, e: "Combined rate per minute = 1/20 + 1/30 = (3 + 2)/60 = 5/60 = 1/12. Hence, the cistern fills in 12 minutes." },
  { s: "Arithmetic", q: "A person covers a distance of 180 km in 4 hours. If he travels the first half of the distance at 30 km/h, at what speed must he travel the second half to complete the journey on time?", o: ["45 km/h", "60 km/h", "90 km/h", "75 km/h"], a: 2, e: "First half = 90 km at 30 km/h takes 90/30 = 3 hours. Time left for second half = 4 - 3 = 1 hour. Distance left = 90 km. Required speed = 90 / 1 = 90 km/h." }
];

// Initialize Palette and Questions
const form = document.getElementById("quiz-form");
const palette = document.getElementById("palette-grid");

questions.forEach((item, idx) => {
  // Add Palette button
  const pBtn = document.createElement("button");
  pBtn.type = "button";
  pBtn.className = "p-btn";
  pBtn.id = `pbtn-${idx}`;
  pBtn.textContent = idx + 1;
  pBtn.onclick = () => {
    document.getElementById(`qcard-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  palette.appendChild(pBtn);

  // Add Question Card
  const card = document.createElement("div");
  card.className = "q-card";
  card.id = `qcard-${idx}`;
  card.innerHTML = `
    <div class="q-meta">${item.s} • Q.${idx + 1}</div>
    <div class="q-title">${idx + 1}. ${item.q}</div>
    ${item.o.map((opt, oIdx) => `
      <label class="opt" id="opt-${idx}-${oIdx}">
        <input type="radio" name="q${idx}" value="${oIdx}" onchange="markAnswered(${idx})">
        <span>${String.fromCharCode(65 + oIdx)}) ${opt}</span>
      </label>
    `).join('')}
    <div class="exp" id="exp-${idx}"><strong>Explanation / Rationale:</strong> ${item.e}</div>
  `;
  form.appendChild(card);
});

function markAnswered(idx) {
  const pBtn = document.getElementById(`pbtn-${idx}`);
  if (pBtn) pBtn.classList.add("answered");
}

// 50 minutes timer
let secLeft = 50 * 60;
const tTimer = setInterval(() => {
  secLeft--;
  const m = Math.floor(secLeft / 60);
  const s = secLeft % 60;
  document.getElementById("timer").textContent = `Time Left: ${m}:${s < 10 ? '0' : ''}${s}`;
  if (secLeft <= 0) { 
    clearInterval(tTimer); 
    evaluateQuiz(); 
  }
}, 1000);

function evaluateQuiz() {
  clearInterval(tTimer);
  let correct = 0, wrong = 0, unattempted = 0;

  questions.forEach((item, idx) => {
    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
    const expBox = document.getElementById(`exp-${idx}`);
    const pBtn = document.getElementById(`pbtn-${idx}`);
    expBox.style.display = "block";

    const correctLabel = document.getElementById(`opt-${idx}-${item.a}`);
    if (correctLabel) correctLabel.classList.add("correct-highlight");

    if (!selected) {
      unattempted++;
    } else {
      const userVal = parseInt(selected.value);
      if (userVal === item.a) {
        correct++;
        if (pBtn) { pBtn.className = "p-btn correct"; }
      } else {
        wrong++;
        const wrongLabel = document.getElementById(`opt-${idx}-${userVal}`);
        if (wrongLabel) wrongLabel.classList.add("wrong-highlight");
        if (pBtn) { pBtn.className = "p-btn wrong"; }
      }
    }
  });

  const finalScore = ((correct * 2) - (wrong * 0.67)).toFixed(2);
  document.getElementById("score-text").textContent = `${finalScore} / 100`;
  document.getElementById("score-details").textContent = `Correct: ${correct} (+${correct * 2} Marks) | Wrong: ${wrong} (-${(wrong * 0.67).toFixed(2)} Marks) | Unattempted: ${unattempted}`;
  document.getElementById("result").style.display = "block";
  document.getElementById("submit-btn").style.display = "none";
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
